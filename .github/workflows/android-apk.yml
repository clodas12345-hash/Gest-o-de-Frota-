name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies & build web app
      run: |
        npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Sync Android platform with Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Decodificar Keystore Fixa a partir do Segredo
      run: |
        echo "Tamanho do segredo (deve ser próximo de 3664):"
        echo -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | wc -c
        if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
          echo "✅ release.keystore decodificado a partir do segredo DEBUG_KEYSTORE_BASE64"
          ls -la release.keystore
        else
          echo "⚠️ Segredo DEBUG_KEYSTORE_BASE64 não encontrado — build vai usar assinatura padrão"
        fi

    - name: Configurar Keystore Fixo para Assinatura Consistente
      run: |
        mkdir -p ~/.android
        if [ -f "release.keystore" ]; then
          cp release.keystore ~/.android/debug.keystore
          echo "✅ Keystore fixo configurado em ~/.android/debug.keystore (garante mesma assinatura em todos os builds)"
        fi

    - name: Forçar signingConfig do App para Usar o Keystore Fixo
      run: |
        if grep -q "android.signingConfigs.debug.storeFile" android/app/build.gradle; then
          echo "ℹ️ signingConfig já estava forçado — nada a fazer"
          exit 0
        fi
        cat >> android/app/build.gradle << 'EOF'

        android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
        android.signingConfigs.debug.storePassword = "android"
        android.signingConfigs.debug.keyAlias = "androiddebugkey"
        android.signingConfigs.debug.keyPassword = "android"
        android.buildTypes.debug.signingConfig = android.signingConfigs.debug
        EOF
        echo "✅ signingConfig do buildType debug forçado a usar ~/.android/debug.keystore"

    - name: Build Debug APK with Gradle (Fast & Parallel)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --parallel --build-cache -x lint -x test -x lintVitalRelease

    - name: Preparar APK com Nome Gestão de Frota
      run: |
        ORIGINAL_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
        echo "APK gerado: $ORIGINAL_APK"
        if [ "$ORIGINAL_APK" != "android/app/build/outputs/apk/debug/Gestão de Frota.apk" ]; then
          cp "$ORIGINAL_APK" "android/app/build/outputs/apk/debug/Gestão de Frota.apk"
        fi
        ls -la "android/app/build/outputs/apk/debug/"

    - name: Verificar Fingerprint da Assinatura do APK
      continue-on-error: true
      run: |
        SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        APK="android/app/build/outputs/apk/debug/Gestão de Frota.apk"
        APKSIGNER=$(ls $SDK/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
        echo "=== Fingerprint da assinatura deste APK (compare entre builds) ==="
        if [ -z "$APKSIGNER" ]; then
          echo "apksigner nao encontrado - pulando verificacao"
          exit 0
        fi
        "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gestão de Frota
        path: android/app/build/outputs/apk/debug/Gestão de Frota.apk
        compression-level: 0
